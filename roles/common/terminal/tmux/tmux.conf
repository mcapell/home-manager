set -g extended-keys on
set -g extended-keys-format csi-u
set -g mouse on

# Send copy-mode selections to the terminal clipboard using OSC 52.
# This avoids platform-specific commands such as pbcopy, xclip, or wl-copy.
set -s set-clipboard on
set -as terminal-features ',*:clipboard'

# Keep enough output for builds, tests, and agent conversations.
set -g history-limit 100000

# Notify terminal programs when a pane gains focus.
set -g focus-events on

# Keep window numbering compact after windows are closed.
set -g renumber-windows on

# Move between panes with Alt+h/j/k/l.
bind-key -n M-h select-pane -Z -L
bind-key -n M-j select-pane -Z -D
bind-key -n M-k select-pane -Z -U
bind-key -n M-l select-pane -Z -R

# Start new panes and windows in the active pane's working directory.
bind-key '"' split-window -v -c '#{pane_current_path}'
bind-key % split-window -h -c '#{pane_current_path}'
bind-key c new-window -c '#{pane_current_path}'
